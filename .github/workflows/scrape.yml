name: scrape

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: scrape
  cancel-in-progress: false

env:
  R_PACKAGES: any::data.table any::httr2 any::rvest any::xml2 any::jsonlite any::ggplot2 any::reactable any::knitr any::rmarkdown any::htmltools

jobs:
  scrape:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: ${{ env.R_PACKAGES }}
          dependencies: '"hard"'

      - name: Skrapa nya tilldelningar och kontrollera dödsfall
        run: Rscript scraper/run.R --auto

      - name: Validera data
        run: Rscript tests/validate.R

      - name: Committa nya tilldelningar
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tilldelningar.csv data/andringslogg.csv
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Skrapning: nya tilldelningar och dödsdatum"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Öppna PR för kandidater
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- data/kandidater.csv; then
            echo "Inga nya kandidater."
            exit 0
          fi
          gren="kandidater/$(date +%Y-%m-%d)"
          git checkout -b "$gren"
          git add data/kandidater.csv
          git commit -m "Kandidater från skrapning"
          git push origin "$gren"
          gh pr create \
            --base main \
            --head "$gren" \
            --title "Kandidater $(date +%Y-%m-%d)" \
            --body "Fynd från andra källor än kungahuset.se och regeringen.se. Granska varje rad och flytta godkända till data/tilldelningar.csv."

  publish:
    needs: scrape
    if: needs.scrape.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: ${{ env.R_PACKAGES }}
          dependencies: '"hard"'

      - uses: quarto-dev/quarto-actions/setup@v2

      - uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
