name: scrape

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::data.table
            any::httr2
            any::rvest
            any::xml2
            any::jsonlite

      - name: Skrapa nya tilldelningar och kontrollera dödsfall
        run: Rscript scraper/run.R --auto

      - name: Validera data
        run: Rscript tests/validate.R

      - name: Committa nya tilldelningar
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tilldelningar.csv data/andringslogg.csv
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Skrapning: nya tilldelningar och dödsdatum"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publicera webbplatsen
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run publish.yml --ref main

      - name: Öppna PR för kandidater
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- data/kandidater.csv; then
            echo "Inga nya kandidater."
            exit 0
          fi
          gren="kandidater/$(date +%Y-%m-%d)"
          git checkout -b "$gren"
          git add data/kandidater.csv
          git commit -m "Kandidater från skrapning"
          git push origin "$gren"
          gh pr create \
            --base main \
            --head "$gren" \
            --title "Kandidater $(date +%Y-%m-%d)" \
            --body "Fynd från andra källor än kungahuset.se och regeringen.se. Granska varje rad och flytta godkända till data/tilldelningar.csv."
