name: scrape

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::data.table
            any::httr2
            any::rvest
            any::xml2
            any::jsonlite

      - name: Hämta kandidater från en öppen kandidat-PR
        id: oppen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gren=$(gh pr list --state open --json headRefName --jq '[.[] | select(.headRefName | startswith("kandidater/"))][0].headRefName // empty')
          if [ -n "$gren" ]; then
            git fetch origin "$gren"
            git show "origin/$gren:data/kandidater.csv" > data/kandidater.csv
          fi
          echo "gren=$gren" >> "$GITHUB_OUTPUT"

      - name: Skrapa nya tilldelningar och kontrollera dödsfall
        run: Rscript scraper/run.R --auto

      - name: Validera data
        run: Rscript tests/validate.R

      - name: Committa nya tilldelningar
        id: commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tilldelningar.csv data/andringslogg.csv
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Skrapning: nya tilldelningar och dödsdatum"
            for forsok in 1 2 3; do
              if git pull --rebase --autostash origin main && git push origin HEAD:main; then
                break
              fi
              git rebase --abort 2>/dev/null || true
              if [ "$forsok" = 3 ]; then
                echo "Kunde inte pusha efter tre försök (samtidig ändring på main)." >&2
                exit 1
              fi
              sleep $((forsok * 10))
            done
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publicera webbplatsen
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run publish.yml --ref main

      - name: Öppna eller uppdatera PR för kandidater
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPPEN_GREN: ${{ steps.oppen.outputs.gren }}
        run: |
          set -euo pipefail
          if [ -n "$OPPEN_GREN" ]; then
            if git diff --quiet "origin/$OPPEN_GREN" -- data/kandidater.csv; then
              echo "Inga nya kandidater utöver den öppna PR:en."
              exit 0
            fi
            cp data/kandidater.csv "$RUNNER_TEMP/kandidater.csv"
            git checkout -f -B "$OPPEN_GREN" "origin/$OPPEN_GREN"
            cp "$RUNNER_TEMP/kandidater.csv" data/kandidater.csv
            git add data/kandidater.csv
            git commit -m "Fler kandidater från skrapning"
            git push origin "$OPPEN_GREN"
            exit 0
          fi
          if git diff --quiet -- data/kandidater.csv; then
            echo "Inga nya kandidater."
            exit 0
          fi
          gren="kandidater/$(date -u +%Y-%m-%d)-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git checkout -b "$gren"
          git add data/kandidater.csv
          git commit -m "Kandidater från skrapning"
          git push origin "$gren"
          gh pr create \
            --base main \
            --head "$gren" \
            --title "Kandidater $(date -u +%Y-%m-%d)" \
            --body "Fynd från andra källor än kungahuset.se och regeringen.se. Granska varje rad och flytta godkända till data/tilldelningar.csv."
