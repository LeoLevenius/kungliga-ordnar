project:
  type: website
  output-dir: _site
  render:
    - index.qmd
    - bevakning.qmd
    - oppna-data.qmd
    - ordensguide.qmd
    - redigera.qmd
    - statistik.qmd
    - ordnar/*.qmd
    - mallar/person.qmd
  post-render:
    - Rscript R/build_persons.R
    - Rscript R/export.R
  resources:
    - img
    - redigera.js
    - tillganglighet.js

website:
  title: "Kungliga ordnar"
  description: "Levande mottagare av de fyra kungliga riddarordnarna, med grad, datum och källa."
  navbar:
    left:
      - text: Start
        href: index.qmd
      - text: Serafimerorden
        href: ordnar/serafimerorden.qmd
      - text: Svärdsorden
        href: ordnar/svardsorden.qmd
      - text: Nordstjärneorden
        href: ordnar/nordstjarneorden.qmd
      - text: Vasaorden
        href: ordnar/vasaorden.qmd
      - text: Statistik
        href: statistik.qmd
      - text: Ordensguide
        href: ordensguide.qmd
      - text: Öppna data
        href: oppna-data.qmd
      - text: Bevakning
        href: bevakning.qmd
  page-footer:
    left: "Källor: kungahuset.se, regeringen.se, kungligmajestatsorden.se. Avlidna mottagare visas inte. <br>Senast uppdaterad: UPPDATERINGSTIDMARKOR"
    right:
      - text: Redigera
        href: redigera.qmd

format:
  html:
    theme: cosmo
    css: styles.css
    lang: sv
    page-layout: full
    language:
      skip-to-content: "Hoppa till huvudinnehållet"
    toc: false
    include-in-header:
      - text: |
          <script>try{if(localStorage.getItem("kungliga-ordnar-token"))document.documentElement.classList.add("redigerare")}catch(e){}</script>
          <script>document.addEventListener("DOMContentLoaded", function () { var s = document.createElement("script"); s.src = (document.querySelector('meta[name="quarto:offset"]')?.content || "./") + "tillganglighet.js"; document.head.appendChild(s); });</script>

lang: sv

execute:
  echo: false
  warning: true
  message: false
